services:
  notifications:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOLYCOW_NOTIFICATIONS_DB: /data/notifications.sqlite3
      HOLYCOW_EVIDENCE_DIRECTORY: /evidence
    ports:
      - "127.0.0.1:8870:8870"
    volumes:
      - notification-data:/data
      - ./evidence:/evidence:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8870/healthz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s
volumes:
  notification-data:
